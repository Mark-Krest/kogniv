<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="kGrad" x1="0" y1="0" x2="128" y2="128">
      <stop offset="0" stop-color="#00F0FF"/>
      <stop offset="1" stop-color="#FCEE0A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Фон: срезанные углы (фирменный стиль) -->
  <path d="M24 4 H124 V104 L104 124 H4 V24 Z"
        fill="#0B0C10" stroke="url(#kGrad)" stroke-width="3"/>

  <!-- Тонкая внутренняя рамка -->
  <path d="M28 12 H116 V100 L100 116 H12 V28 Z"
        fill="none" stroke="#1F2430" stroke-width="1.5"/>

  <!-- Буква K из схемных линий -->
  <g stroke="url(#kGrad)" stroke-width="8" stroke-linecap="square" filter="url(#glow)">
    <!-- Вертикаль -->
    <path d="M38 32 V96"/>
    <!-- Верхняя диагональ -->
    <path d="M86 32 L50 64"/>
    <!-- Нижняя диагональ -->
    <path d="M52 66 L88 96"/>
  </g>

  <!-- Нервные узлы (точки-соединения) -->
  <g fill="#FCEE0A" filter="url(#glow)">
    <circle cx="38" cy="32" r="6"/>
    <circle cx="38" cy="96" r="6"/>
    <circle cx="86" cy="32" r="6"/>
    <circle cx="88" cy="96" r="6"/>
    <circle cx="51" cy="64" r="6"/>
  </g>

  <!-- Сигнальная точка (циан) -->
  <circle cx="104" cy="24" r="4" fill="#00F0FF" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>